edition = "2023";
import "google/protobuf/cpp_features.proto";
package packaging;
option features.field_presence = IMPLICIT;
message OrdinaryRepeated {
  repeated bytes payload = 1 [features.(pb.cpp).string_type = STRING];
  repeated string text = 2 [features.(pb.cpp).string_type = STRING];
  repeated bytes distant = 1000 [features.(pb.cpp).string_type = STRING];
}
message MicroRepeated {
  repeated bytes payload = 1 [features.(pb.cpp).string_type = VIEW];
  repeated string text = 2 [features.(pb.cpp).string_type = VIEW];
  repeated bytes distant = 1000 [features.(pb.cpp).string_type = VIEW];
}
message MicroParsePaths {
  repeated string narrow = 1 [features.(pb.cpp).string_type = VIEW];
  repeated string medium = 1000 [features.(pb.cpp).string_type = VIEW];
  repeated string far = 10000 [features.(pb.cpp).string_type = VIEW];
  repeated bytes far_bytes = 10001 [features.(pb.cpp).string_type = VIEW];
}
